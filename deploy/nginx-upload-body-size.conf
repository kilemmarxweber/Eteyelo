# À inclure dans le server {} (ou http {}) qui reverse-proxy vers Next.js.
# Sans ça, nginx refuse les uploads > 1 Mo (défaut) avec HTTP 413,
# même si Next.js autorise jusqu’à 50–64 Mo.
#
# Exemple :
#   include /var/www/eteyelo/deploy/nginx-upload-body-size.conf;
#   # ou bien directement :
#   client_max_body_size 64m;
#
# Puis :
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 64m;
