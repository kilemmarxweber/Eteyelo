# Coturn pour Klambo / Eteyelo — auth REST (username = expiry:userid)
# Ports : UDP/TCP 3478, TCP(+UDP) 5349 (TLS), plage UDP 49152-65535
# Le 5349 laisse le 443 libre pour Nginx / le site.
#
# Sur le serveur :
#   1) Copier vers /etc/turnserver.conf
#   2) Remplacer EXTERNAL_IP, REALM, static-auth-secret (= TURN_SECRET Eteyelo)
#   3) Cert Let's Encrypt sur turn.klambocore.com (voir INSTALL-VPS.md)
#   4) Dans Eteyelo .env :
#        TURN_URLS=turn:turn.klambocore.com:3478
#        TURN_SECRET=<même secret que static-auth-secret>
#        TURN_EXPAND_URLS=1
#        TURN_KEEP_PUBLIC_FALLBACK=1

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET
realm=klambocore.com

# IP publique du VPS (obligatoire)
external-ip=CHANGE_ME_PUBLIC_IP

# Relais média
min-port=49152
max-port=65535

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Décommenter quand les certs sont en place :
# cert=/etc/letsencrypt/live/turn.klambocore.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.klambocore.com/privkey.pem

# Logs
verbose
log-file=/var/log/turnserver.log
simple-log
