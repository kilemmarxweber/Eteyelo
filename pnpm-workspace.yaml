# pnpm 11+ reads project settings from this file, not package.json#pnpm or .npmrc.
nodeLinker: hoisted
shamefullyHoist: true

overrides:
  ioredis: 5.10.1

# pnpm 11 fails the install until every package with a build script is listed.
# true = run the native/postinstall script; false = skip it but stop ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  bcrypt: true
  core-js: false
  es5-ext: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
